<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400&family=Caveat:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#0d0c0a',
                        surface: '#161412',
                        line: 'rgba(245,235,220,0.09)',
                        body: '#e8e2d5',
                        muted: '#9b958a',
                        accent: '#ef8b20',
                    },
                    fontFamily: {
                        sans: ['Geist', 'Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                        hand: ['Caveat', 'cursive'],
                    },
                },
            },
        };
    </script>
    <style>
        html { scroll-behavior: smooth; }
        body { background: #0d0c0a; }
        ::selection { background: #ef8b20; color: #0d0c0a; }
        .link-fade { transition: color .2s ease; }
        .link-fade:hover { color: #ef8b20; }
        .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .photo .placeholder {
            position: absolute; inset: 0;
            display: grid; place-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: rgba(245,235,220,0.25);
            letter-spacing: 0.15em;
        }
    </style>
</head>

<body class="font-sans text-body antialiased min-h-screen">

    <header class="sticky top-0 z-50 backdrop-blur-md bg-ink/70 border-b border-line">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.0/gsap.min.js"
        integrity="sha512-1dalHDkG9EtcOmCnoCjiwQ/HEB5SDNqw8d4G2MKoNwjiwMNeBAkudsBCmSlMnXdsH8Bm0mOd3tl/6nL5y0bMaQ=="
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.0/ScrollTrigger.min.js"
        integrity="sha512-QcYm1q7RbnXmwY7HJ0H7938IS0MalTPYqGUF0fIwQgEjMBt2tqjDBt+R5I+ppdwEohjMdHnFU0H+RxmrGQ8qcg=="
        crossorigin="anonymous"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        gsap.utils.toArray('.reveal').forEach((el) => {
            gsap.from(el, {
                scrollTrigger: { trigger: el, start: 'top 88%' },
                y: 20,
                opacity: 0,
                duration: 0.8,
                ease: 'power2.out',
            });
        });

        gsap.from('.photo', {
            scrollTrigger: { trigger: '.photo', start: 'top 90%' },
            opacity: 0,
            y: 16,
            duration: 0.6,
            ease: 'power2.out',
            stagger: 0.05,
        });
    </script>
